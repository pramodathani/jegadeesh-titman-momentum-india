[build-system]
requires = [
    "hatchling>=1.27",
]
build-backend = "hatchling.build"

[project]
name = "jegadeesh-titman-india"
version = "0.1.0"
description = "Jegadeesh and Titman (1993) momentum replicated on Indian shares: NSE bhavcopy data from 2005 with corporate actions, all 32 J/K strategies, Indian costs, and long-only portfolios that can be traded live."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Pramod Athani", email = "pramod.r.athani@gmail.com" },
]
keywords = [
    "momentum",
    "jegadeesh-titman",
    "india",
    "nse",
    "quantitative-finance",
    "factor-investing",
    "backtesting",
    "replication",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "statsmodels>=0.14",
]

[project.scripts]
jt-momentum-app = "jegadeesh_titman_india.site_server:SiteServerApplication.launch"

[project.optional-dependencies]
live = [
    "tradingmachine @ git+https://github.com/pramodathani/tradingmachine.git",
]
test = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/pramodathani/jegadeesh-titman-momentum-india"
Paper = "https://www.jstor.org/stable/2328882"
Library = "https://github.com/pramodathani/tradingmachine"

[tool.hatch.build.targets.wheel]
packages = [
    "src/jegadeesh_titman_india",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
